<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f3d33" />
  <title>Oasis — Smart Desert Orchard Management</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>" />
</head>
<body>
  <div id="app">
    <div id="login-shell" class="hidden"></div>
    <div id="main-shell" class="hidden">
      <aside id="sidebar" class="hidden">
        <div class="brand">
          <span class="brand-mark">🌴</span>
          <span class="brand-text">Oasis</span>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-footer" id="sidebar-footer"></div>
      </aside>
      <div class="main-wrap">
        <header id="topbar">
          <button id="nav-toggle" class="icon-btn" aria-label="Menu">☰</button>
          <div id="topbar-title" class="topbar-title">Dashboard</div>
          <div class="topbar-right">
            <button id="lang-btn" class="chip-btn" title="Language">🌐 EN</button>
            <button id="alert-bell" class="icon-btn" title="Alerts">🔔<span id="bell-badge" class="badge hidden">0</span></button>
            <div id="user-chip" class="user-chip"></div>
          </div>
        </header>
        <main id="content" class="content"></main>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
